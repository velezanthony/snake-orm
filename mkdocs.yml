          - Migrations: users/getting-started/migrations.md
          - Runnable examples: users/getting-started/examples.md
      - Guide:
          - Columns and types: users/guide/columns.md
          - Relationships: users/guide/relationships.md
          - Inheritance: users/guide/inheritance.md
