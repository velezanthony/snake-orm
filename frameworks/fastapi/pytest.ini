[pytest]
# Config LOCAL de la demo: al correr `pytest` dentro de frameworks/fastapi, pytest coge este fichero
# (no el pyproject raíz, que apunta a src/test). Así `app` es importable y solo corren estos tests.
pythonpath = .
testpaths = tests
addopts = -q
# `SnakeWarning` NO se silencia, y merece el párrafo porque estuvo silenciado por CATEGORÍA.
#
# Que la sesión avise UNA vez por cada salvedad del motor es funcionalidad de portada de este ORM:
# lo que un motor no da, se DECLARA. Ignorar la categoría entera aquí dejaba esa función sin
# verificar en ninguna de las cuatro suites de demos —`pytest.warns` no aparecía ni una vez— mientras
# el código de `shared/` SÍ ramifica según lo que el motor puede (`supports_row_locking`,
# `supports_parenthesised_compound`, `supports_returning`).
#
# Y el coste que compraba ese silencio, medido: 19 líneas en TODA la ejecución. El aviso sale una vez
# por (motor, salvedad) y por PROCESO, no por sesión ni por test. Diecinueve líneas una vez es lo que
# se estaba pagando por no comprobar la promesa del proyecto en su propio escaparate.
#
# Las demos de Django y Flask nunca lo silenciaron: enseñaban las salvedades mientras estas dos las
# escondían.
filterwarnings =
    # NOTHING is silenced by category here, and the empty list is the statement. This file used to
    # carry `ignore::DeprecationWarning`, and a sibling `ignore::SnakeWarning` was removed before it
    # for a measured reason: silencing a whole CATEGORY leaves the thing it covers unverified, and
    # nobody finds out until the day it matters.
    #
    # Measured before removing it: zero deprecation warnings across this suite. So it was hiding
    # nothing today while guaranteeing nobody would see the first one tomorrow — which is the only
    # moment a deprecation is worth anything.
    #
    # If a dependency ever gets noisy, silence THAT module by name. A category is a blindfold; a
    # module is a decision.
