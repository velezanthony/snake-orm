{% extends "layout/base.html" %}
{% block title %}Edit post · SnakeORM Django demo{% endblock %}
{% block content %}
  <div class="page-head">
    <h1 class="h1">Edit post</h1>
  </div>

  {% if error %}<p class="alert alert-error mb-4 max-w-2xl">{{ error }}</p>{% endif %}

  <div class="card max-w-2xl">
    <form class="card-body form" method="post" action="{% url 'post_edit' post_id %}">
      {% csrf_token %}
      {% include "blog/_form.html" %}
      <div class="flex gap-2 pt-1">
        <button class="btn btn-primary btn-md" type="submit">Save</button>
        <a class="btn btn-ghost btn-md" href="{% url 'post_list' %}">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
