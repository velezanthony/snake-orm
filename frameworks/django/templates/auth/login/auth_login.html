{% extends "layout/base.html" %}
{% block title %}Sign in · SnakeORM Django demo{% endblock %}
{% block content %}
  <div class="page-head">
    <h1 class="h1">Sign in</h1>
    <p class="lede">
      Seeded account: <code class="code">demo1</code> / <code class="code">test1234</code>.
    </p>
  </div>

  {% if error %}<p class="alert alert-error mb-4 max-w-md">{{ error }}</p>{% endif %}

  <div class="card max-w-md">
    <form class="card-body form" method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="field">
        <label class="label" for="username">Username</label>
        <input class="input" type="text" id="username" name="username" value="{{ username|default:'' }}" autofocus>
      </div>

      <div class="field">
        <label class="label" for="password">Password</label>
        <input class="input" type="password" id="password" name="password">
      </div>

      <div class="flex gap-2 pt-1">
        <button class="btn btn-primary btn-md" type="submit">Sign in</button>
        <a class="btn btn-ghost btn-md" href="{% url 'register' %}">Create account</a>
      </div>
    </form>
  </div>
{% endblock %}
