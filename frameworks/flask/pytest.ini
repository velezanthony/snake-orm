[pytest]
# Config LOCAL de la demo: al correr `pytest` dentro de frameworks/flask, pytest coge este fichero
# (no el pyproject raíz, que apunta a src/test). Así `app` es importable y solo corren estos tests.
pythonpath = . ..
addopts = -q
# `verify.py` va en el patrón, y ése es el motivo de que este fichero exista.
#
# El target del Makefile era `pytest verify.py`: clavado a UN FICHERO. Es el mismo defecto que el
# target de Django nombra en su propio comentario —"pinned to one app, a suite added to any other
# one exists and never runs, which is the most expensive kind of test there is"— y aquí estaba en su
# forma peor, porque una carpeta al menos crece sola y un fichero no.
#
# Quitar el argumento y ya está no valía: `verify.py` no casa con `test_*.py`, así que la demo se
# habría quedado sin su suite entera al arreglar el pin. Las dos cosas se dicen aquí, que es donde
# el descubrimiento vive, en vez de en la orden que lo invoca.
python_files = test_*.py verify.py
# `SnakeWarning` NO se silencia. Que la sesión avise UNA vez por cada salvedad del motor es
# funcionalidad de portada de este ORM: lo que un motor no da, se DECLARA. Esta demo nunca lo
# silenció y no empieza ahora.
filterwarnings =
    # NOTHING is silenced by category here, and the empty list is the statement. This file used to
    # carry `ignore::DeprecationWarning`, and a sibling `ignore::SnakeWarning` was removed before it
    # for a measured reason: silencing a whole CATEGORY leaves the thing it covers unverified, and
    # nobody finds out until the day it matters.
    #
    # Measured before removing it: zero deprecation warnings across this suite. So it was hiding
    # nothing today while guaranteeing nobody would see the first one tomorrow — which is the only
    # moment a deprecation is worth anything.
    #
    # If a dependency ever gets noisy, silence THAT module by name. A category is a blindfold; a
    # module is a decision.
