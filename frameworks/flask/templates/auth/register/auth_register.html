{% extends "layout/base.html" %}
{% block title %}Sign up · SnakeORM Flask demo{% endblock %}
{% block content %}
  <div class="page-head">
    <h1 class="h1">Create account</h1>
    <p class="lede">
      Username and email are unique. The password is stored hashed, never in the clear.
    </p>
  </div>

  <div class="card max-w-md">
    <form class="card-body form" method="post" action="{{ url_for('auth.register') }}">
      <div class="field">
        <label class="label" for="username">Username</label>
        <input class="input" type="text" id="username" name="username" required autofocus>
      </div>

      <div class="field">
        <label class="label" for="email">Email</label>
        <input class="input" type="email" id="email" name="email" required>
      </div>

      <div class="field">
        <label class="label" for="password">Password</label>
        <input class="input" type="password" id="password" name="password" required>
      </div>

      <div class="flex gap-2 pt-1">
        <button class="btn btn-primary btn-md" type="submit">Sign up</button>
        <a class="btn btn-ghost btn-md" href="{{ url_for('auth.login_form') }}">I already have one</a>
      </div>
    </form>
  </div>
{% endblock %}
